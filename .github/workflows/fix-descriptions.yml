# GitHub Actions Workflow `fix-descriptions`

name: Fix Short Descriptions Bot

on:
  # workflow_dispatch:
  # schedule:
  #   - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: fix-descriptions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests pytrends openai googletrans==4.0.0rc1
          fi

      - name: Start OmniRoute gateway (bundled in repo → 127.0.0.1:20128)
        uses: ./omniroute-gateway
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          storage-encryption-key: ${{ secrets.STORAGE_ENCRYPTION_KEY }}

      - name: Run Fix Short Descriptions Bot
        env:
          OMNIROUTE_URL: http://127.0.0.1:20128/v1/chat/completions
          OMNIROUTE_MODEL: ${{ secrets.OMNIROUTE_MODEL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 fix_short_descriptions_bot.py

      - name: Submit to Bing Webmaster Tools (IndexNow)
        run: python3 google_indexer.py || true

      - name: Commit and push changes
        run: |
          git config --local user.email "bot-fix@tomit.click"
          git config --local user.name "Tomito Fix Bot"

          # Add updated JSON files, tracking file, and indexer progress
          git add data/content/ data/fixed_pages.json indexer_progress.json || true

          # Check if there are any changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix-descriptions-bot: fixed short meta descriptions (batch of 25)"
            git push
          fi
          
