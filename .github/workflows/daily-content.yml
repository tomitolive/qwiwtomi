name: Daily Content Generation

on:
  schedule:
    # Run every 20 minutes
    - cron: '*/20 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  generate-content:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install requests huggingface_hub
      
      - name: Run daily content generation
        env:
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 daily_content.py --count 2
          sleep 5

      - name: Download missing poster images
        run: python3 download_all_images.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/content/ data/content_index.json data/search_index.js public/t/p/
          git diff --staged --quiet || git commit -m "Auto-generate content [skip ci]"
          git push
