name: Trending Bot

on:
  # schedule:
  #   - cron: '0 */3 * * *'  # Every 3 hours
  # workflow_dispatch:

permissions:
  contents: write

jobs:
  trending-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests googletrans==4.0.0-rc1 google-auth google-auth-httplib2 google-api-python-client pytrends lxml

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Trending Bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NVIDIA_NIM_KEY_1: ${{ secrets.NVIDIA_NIM_KEY_1 }}
          NVIDIA_NIM_KEY_2: ${{ secrets.NVIDIA_NIM_KEY_2 }}
          NVIDIA_NIM_KEY_3: ${{ secrets.NVIDIA_NIM_KEY_3 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          GCP_INDEXING_KEY: ${{ secrets.GCP_INDEXING_KEY }}
        run: |
          python fix_short_descriptions_bot.py

      - name: Commit and push changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Auto-update: Trending content $(date '+%Y-%m-%d %H:%M')"
            git push