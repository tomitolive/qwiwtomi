# OmniRoute Bot — Mixed-Content Pipeline
# ==============================================
# يشغّل run_bot_with_mixed_content.py على GitHub Actions مجاناً، مع OmniRoute
# منصّب من نفس repo (omniroute-gateway) كخلفية على 127.0.0.1:20128.
# لا يحتاج سيرفراً خارجياً إطلاقاً. 🖥️ PC طافي 🚀
name: OmniRoute Mixed-Content Bot

on:
  schedule:
    # اضبط الجدول كما تشاء (يُستخدم توقيت UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch: # تشغيل يدوي من تبويب Actions
    inputs:
      dry_run:
        description: 'معاينة فقط (توليد + عرض، بدون كتابة أي ملف / بدون push)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: omniroute-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests googletrans==4.0.0-rc1 google-auth google-auth-httplib2 google-api-python-client pytrends lxml

      - name: Start OmniRoute gateway (bundled in repo → 127.0.0.1:20128)
        uses: ./omniroute-gateway
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          storage-encryption-key: ${{ secrets.STORAGE_ENCRYPTION_KEY }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Mixed-Content Bot (all AI via OmniRoute)
        env:
          OMNIROUTE_URL: http://127.0.0.1:20128/v1/chat/completions
          OMNIROUTE_MODEL: ${{ secrets.OMNIROUTE_MODEL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          GCP_INDEXING_KEY: ${{ secrets.GCP_INDEXING_KEY }}
          BOT_DRY_RUN: ${{ (inputs.dry_run == 'true') && '1' || '0' }}
        run: |
          python run_bot_with_mixed_content.py

      - name: Commit and push changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Auto-update: OmniRoute mixed-content $(date '+%Y-%m-%d %H:%M')"
            git push
          fi